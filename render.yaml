services:
  - type: web
    name: atlas-financial-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python backend/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
